on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      adapter: ""

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: typescript
    call: ${{ run.dir }}/pulumi/typescript.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}

  - key: python
    call: ${{ run.dir }}/pulumi/python.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}

  - key: go
    call: ${{ run.dir }}/pulumi/go.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}

  - key: yaml
    call: ${{ run.dir }}/pulumi/yaml.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}

  - key: dotnet
    call: ${{ run.dir }}/pulumi/dotnet.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}
