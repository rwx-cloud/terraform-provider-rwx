on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      adapter: ""

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: python
    call: python/install 2.0.2
    with:
      python-version: 3.14.4

  - key: test
    use: python
    call: ${{ run.dir }}/packages/pulumi-compatibility.yml
    with:
      language: python
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}
