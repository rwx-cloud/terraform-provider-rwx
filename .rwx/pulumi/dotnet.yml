on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      adapter: ""

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.2

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      repository: https://github.com/rwx-cloud/terraform-provider-rwx.git
      ref: ${{ init.commit-sha }}

  - key: dotnet
    use: code
    call: dotnet/install 1.1.1
    with:
      global-json-file: tests/pulumi/testdata/dotnet/global.json
    filter: [tests/pulumi/testdata/dotnet/global.json]

  - key: test
    use: dotnet
    call: ${{ run.dir }}/packages/pulumi-compatibility.yml
    with:
      language: dotnet
      commit-sha: ${{ init.commit-sha }}
      adapter: ${{ init.adapter }}
