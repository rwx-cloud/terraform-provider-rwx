# Full validation pipeline for the provider.

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

tool-cache:
  vault: terraform_provider

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      preserve-git-dir: true
      fetch-full-depth: true
      repository: https://github.com/rwx-cloud/terraform-provider-rwx.git
      ref: ${{ init.commit-sha }}

  - key: tool-versions
    use: code
    call: rwx/tool-versions 1.1.0
    filter:
      - .tool-versions

  - key: go
    call: golang/install 1.3.0
    with:
      go-version: ${{ tasks.tool-versions.values.golang }}

  - key: golangci-lint
    use: go
    run: |
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sudo sh -s -- -b /usr/local/bin v${{ tasks.tool-versions.values.golangci-lint }}

  - key: terraform
    call: hashicorp/install-terraform 1.1.2
    with:
      terraform-version: ${{ tasks.tool-versions.values.terraform }}

  - key: goreleaser
    run: |
      curl -sfLO "$RELEASES_URL/download/$VERSION/$TAR_FILE"
      tmpdir=$(mktemp -d)
      tar -xf $TAR_FILE -C $tmpdir
      sudo install ${tmpdir}/goreleaser /usr/local/bin
      rm $TAR_FILE
      rm -rf $tmpdir
    env:
      VERSION: "v${{ tasks.tool-versions.values.goreleaser }}"
      RELEASES_URL: "https://github.com/goreleaser/goreleaser/releases"
      TAR_FILE: "goreleaser_Linux_x86_64.tar.gz"

  - key: go-modules
    use: [code, go]
    run: |
      go mod download -x
      cd tools
      go mod download -x
    tool-cache: go-modules
    filter:
      - go.mod
      - go.sum
      - tools/go.mod
      - tools/go.sum

  - key: go-mod-tidy
    use: go-modules
    run: |
      go mod tidy
      git diff --exit-code

  - key: build
    use: go-modules
    run: go build -v .

  - key: lint
    use: [go-modules, golangci-lint]
    run: golangci-lint run --timeout=10m

  - key: docs
    use: [go-modules, terraform]
    run: |
      pushd tools
        go generate ./...
      popd
      git diff --exit-code

  - key: test
    use: [go-modules, terraform]
    run: go test -v ./...
    env:
      TF_ACC: 1
      RWX_ACCESS_TOKEN: ${{ vaults.terraform_provider.secrets.RWX_ACCESS_TOKEN }}

  - key: release-dry-run
    use: [go-modules, goreleaser]
    run: goreleaser release --clean --skip=validate,publish,sign
    env:
      GORELEASER_CURRENT_TAG: v0.0.0-ci

  # Prove the compiled provider is a valid plugin that Terraform can load and
  # configure end-to-end: build the binary, point Terraform at it with a dev
  # override, and run `terraform plan` against the install-verification example.
  - key: verify-provider
    use: [go-modules, terraform]
    run: |
      plugin_dir="$(mktemp -d)"
      go build -o "${plugin_dir}/terraform-provider-rwx" .

      export TF_CLI_CONFIG_FILE="$(mktemp)"
      cat > "$TF_CLI_CONFIG_FILE" <<EOF
      provider_installation {
        dev_overrides {
          "rwx-cloud/rwx" = "${plugin_dir}"
        }
        direct {}
      }
      EOF

      cd examples/provider-install-verification
      # dev_overrides makes Terraform skip `init` and use the local binary.
      terraform plan
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.terraform_provider.secrets.RWX_ACCESS_TOKEN }}
