# Publishes a release on every version tag push (e.g. v1.2.3).

on:
  github:
    push:
      if: ${{ event.git.tag =~ '^v.+$' }}
      init:
        commit-sha: ${{ event.git.sha }}
        tag: ${{ event.git.tag }}

concurrency-pools:
  # Releases must never be cancelled mid-flight; queue if the same tag is
  # somehow pushed again while a release is running.
  - id: rwx-cloud/terraform-provider-rwx:release-${{ init.tag }}
    capacity: 1
    on-overflow: queue

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: ci
    call: ${{ run.dir }}/ci.yml
    init:
      commit-sha: ${{ init.commit-sha }}

  - key: release
    call: ${{ run.dir }}/release.yml
    after: ci
    init:
      commit-sha: ${{ init.commit-sha }}
      tag: ${{ init.tag }}
